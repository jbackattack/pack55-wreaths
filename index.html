const FB_PROJECT = "pack-55-wreath-sale";
const FB_API_KEY = "AIzaSyAXFlNP2xISxy9HoXf12jDry129JDn11sU";
const FB_BASE = `https://firestore.googleapis.com/v1/projects/${FB_PROJECT}/databases/(default)/documents/wreathsale`;
const store = {
  async get(key) {
    try {
      const res = await fetch(`${FB_BASE}/${key}?key=${FB_API_KEY}`);
      if (!res.ok) return null;
      const data = await res.json();
      const str = data.fields?.value?.stringValue;
      return str ? JSON.parse(str) : null;
    } catch (e) {
      console.error("Firebase get error", e);
      return null;
    }
  },
  async set(key, val) {
    try {
      await fetch(`${FB_BASE}/${key}?key=${FB_API_KEY}`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          fields: {
            value: {
              stringValue: JSON.stringify(val)
            }
          }
        })
      });
    } catch (e) {
      console.error("Firebase set error", e);
    }
  }
};
